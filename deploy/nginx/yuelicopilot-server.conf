# Yueli Copilot — server 生产态（静态前端 + 反代 KGM / Skill Executor）
# 前置：本机已启动 KGM(:3080) 与 Skill Executor(:3010)，例如：
#   YUELI_DEPLOY_PROFILE=server YUELI_FRONTEND_MODE=skip ./start.sh
# 或将端口改为与下方 upstream 一致。

upstream yueli_kgm {
  server 127.0.0.1:3080;
  keepalive 8;
}

upstream yueli_executor {
  server 127.0.0.1:3010;
  keepalive 8;
}

server {
  listen 3020;
  server_name _;

  # 替换为 npm run build 产出的 dist 绝对路径
  root /var/www/yuelicopilot/dist;
  index index.html;

  client_max_body_size 32m;

  location /health {
    default_type application/json;
    return 200 '{"status":"ok","service":"yueli-nginx-gateway"}';
  }

  location /kgm/ {
    proxy_pass http://yueli_kgm/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;
    proxy_buffering off;
  }

  location /api/ {
    proxy_pass http://yueli_executor/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;
  }

  location /proxy/ {
    proxy_pass http://yueli_executor/proxy/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Proxy-Target $request_uri;
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
