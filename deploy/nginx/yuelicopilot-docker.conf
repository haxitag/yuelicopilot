# Docker 内 Nginx：upstream 指向宿主机（需 host.docker.internal）
# 配合 deploy/docker-compose.server.yml

upstream yueli_kgm {
  server host.docker.internal:3080;
  keepalive 4;
}

upstream yueli_executor {
  server host.docker.internal:3010;
  keepalive 4;
}

server {
  listen 3020;
  server_name _;

  root /var/www/yuelicopilot/dist;
  index index.html;

  client_max_body_size 32m;

  location /health {
    default_type application/json;
    return 200 '{"status":"ok","service":"yueli-nginx-gateway"}';
  }

  location /kgm/ {
    proxy_pass http://yueli_kgm/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
    proxy_buffering off;
  }

  location /api/ {
    proxy_pass http://yueli_executor/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
  }

  location /proxy/ {
    proxy_pass http://yueli_executor/proxy/;
    proxy_http_version 1.1;
    proxy_set_header X-Proxy-Target $request_uri;
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
