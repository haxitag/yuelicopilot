# 示例：仅 Nginx 网关 + 静态 dist（KGM / Executor 在宿主机或其它容器自行启动）
#
# 用法:
#   npm run build
#   docker compose -f deploy/docker-compose.server.yml up -d
#
# 宿主机需监听 3080(KGM)、3010(Executor)，且 nginx 容器能访问 host.docker.internal

services:
  yueli-nginx:
    image: nginx:1.27-alpine
    ports:
      - "3020:3020"
    volumes:
      - ./nginx/yuelicopilot-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ../dist:/var/www/yuelicopilot/dist:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
